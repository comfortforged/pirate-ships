modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"

[[mixins]]
config = "tidesofwar.mixins.json"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "comfortforged"
description = "Command the seas: summon huge sailable pirate ships with giant sails from your inventory. Runs on the server; players should install it too for walkable decks."

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_loader},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
