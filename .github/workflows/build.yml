name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x ./gradlew
      - name: build
        id: build
        continue-on-error: true
        run: ./gradlew build --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: dump Minecraft API signatures
        if: always()
        continue-on-error: true
        run: |
          CP=$(./gradlew -q printClasspath | grep '^CLASSPATH=' | sed 's/^CLASSPATH=//')
          : > api.txt
          while read -r c; do
            [ -z "$c" ] && continue
            echo "===== $c" >> api.txt
            javap -p -cp "$CP" "$c" >> api.txt 2>&1 || true
          done < .github/api-classes.txt
      - name: server self-test
        if: steps.build.outcome == 'success' && hashFiles('**/SelfTest.java') != ''
        continue-on-error: true
        env:
          PIRATESHIPS_SELFTEST: "1"
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\npause-when-empty-seconds=-1\n" > run/server.properties
          timeout 600 ./gradlew runServer 2>&1 | tee server.log || true
          grep -q "PIRATESHIPS SELFTEST PASS" server.log
      - name: package server files and CurseForge profile
        if: steps.build.outcome == 'success'
        run: |
          FAPI=$(find ~/.gradle/caches -name "fabric-api-${FAPI_VER}.jar" | head -1)
          [ -z "$FAPI" ] && curl -sfLo /tmp/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${FAPI_VER}/fabric-api-${FAPI_VER}.jar" && FAPI=/tmp/fabric-api.jar
          MOD=$(ls build/libs/pirate-ships-*.jar | grep -v sources | head -1)
          mkdir -p dist/server-mods dist/profile/overrides/mods
          cp "$MOD" dist/server-mods/ && cp "$FAPI" "dist/server-mods/fabric-api-${FAPI_VER}.jar"
          cp dist/server-mods/*.jar dist/profile/overrides/mods/
          cat > dist/profile/manifest.json <<JSON
          {
            "minecraft": { "version": "26.3", "modLoaders": [ { "id": "fabric-${LOADER_VER}", "primary": true } ] },
            "manifestType": "minecraftModpack",
            "manifestVersion": 1,
            "name": "Pirate Ships",
            "version": "0.1.0",
            "author": "comfortforged",
            "files": [],
            "overrides": "overrides"
          }
          JSON
          (cd dist/profile && zip -qr ../Pirate-Ships-CurseForge-Profile.zip .)
          (cd dist/server-mods && zip -qr ../Pirate-Ships-Server-Mods.zip .)
          ls -la dist
        env:
          FAPI_VER: "0.166.2+26.3"
          LOADER_VER: "0.20.1"
      - name: publish outputs to ci-output branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -f build.log api.txt server.log /tmp/out/ 2>/dev/null || true
          cp -f build/libs/*.jar dist/*.zip /tmp/out/ 2>/dev/null || true
          echo "${{ github.sha }} build=${{ steps.build.outcome }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "CI output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output
      - name: fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
