name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x ./gradlew
      - name: build
        id: build
        continue-on-error: true
        run: ./gradlew build --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: dump Minecraft API signatures
        if: always()
        continue-on-error: true
        run: |
          CP=$(./gradlew -q printClasspath | grep '^CLASSPATH=' | sed 's/^CLASSPATH=//')
          : > api.txt
          while read -r c; do
            [ -z "$c" ] && continue
            echo "===== $c" >> api.txt
            javap -p -cp "$CP" "$c" >> api.txt 2>&1 || true
          done < .github/api-classes.txt
      - name: server self-test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          PIRATESHIPS_SELFTEST: "1"
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          timeout 900 ./gradlew runServer 2>&1 | tee server.log || true
          grep -q "PIRATESHIPS SELFTEST PASS" server.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs
          path: |
            build.log
            api.txt
            server.log
      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'success'
        with:
          name: pirate-ships-jar
          path: build/libs/
      - name: fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
